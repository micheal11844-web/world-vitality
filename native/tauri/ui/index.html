<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Vitality</title>
    <link rel="stylesheet" href="boot.css" />
  </head>
  <body>
    <main>
      <div id="opening" role="status">
        <h1>World Vitality</h1>
        <p>Opening…</p>
      </div>
      <div id="offline" hidden>
        <h1>You’re offline</h1>
        <p>
          World Vitality couldn’t reach the internet. Check your connection, then try again. Nothing
          you saved has been lost.
        </p>
        <button id="retry" class="button" type="button">Try again</button>
      </div>
    </main>
    <script src="boot.js"></script>
  </body>
</html>
