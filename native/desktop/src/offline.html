<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Vitality — offline</title>
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        World Vitality couldn’t reach the internet. Check your connection, then try again. Nothing
        you saved has been lost.
      </p>
      <a id="retry" class="button" href="#">Try again</a>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
