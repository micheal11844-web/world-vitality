<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Vitality</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --text: #1f2320;
        --muted: #5b6660;
        --accent: #1d6e56;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171a;
          --text: #eceae4;
          --muted: #9a9a92;
          --accent: #5dcaa5;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 480px;
        text-align: left;
      }
      .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--accent);
        margin-bottom: 24px;
      }
      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="presentation"></div>
      <h1>World Vitality</h1>
      <p>
        We're building the platform. This page confirms the deployment pipeline is working — the
        real application isn't live here yet.
      </p>
      <div class="status">
        <span class="dot"></span>
        <span>In active development</span>
      </div>
    </main>
  </body>
</html>
