name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action refuses to run when it and
      # package.json's "packageManager" both name a version, and package.json
      # is the one place that decides it (pnpm@9.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run typecheck
      - run: pnpm run test

  # Closes the Stage 7 gap flagged in
  # docs/reviews/stage-7-observability-security-accessibility.md:
  # "no dependency-scanning in CI".
  #
  # `continue-on-error: true`, deliberately, for now: `pnpm audit
  # --audit-level=high` still reports findings that cannot be fixed by a
  # routine upgrade (build-time packages pinned inside `next`, and two
  # direct dependencies that need a major-version change). Each is listed
  # and reasoned about in docs/security/known-vulnerabilities.md, which
  # also says how to keep that list honest. The job stays informational
  # (visible in every CI run, never silently hidden) rather than blocking
  # every PR. Flip `continue-on-error` to `false` once the audit is clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action refuses to run when it and
      # package.json's "packageManager" both name a version, and package.json
      # is the one place that decides it (pnpm@9.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
