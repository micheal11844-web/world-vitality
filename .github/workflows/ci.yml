name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action refuses to run when it and
      # package.json's "packageManager" both name a version, and package.json
      # is the one place that decides it (pnpm@9.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run typecheck
      - run: pnpm run test

  # Closes the Stage 7 gap flagged in
  # docs/reviews/stage-7-observability-security-accessibility.md:
  # "no dependency-scanning in CI".
  #
  # `continue-on-error: true`, deliberately, for now: `pnpm audit
  # --audit-level=high` still reports findings that cannot be fixed by a
  # routine upgrade (build-time packages pinned inside `next`, and two
  # direct dependencies that need a major-version change). Each is listed
  # and reasoned about in docs/security/known-vulnerabilities.md, which
  # also says how to keep that list honest. The job stays informational
  # (visible in every CI run, never silently hidden) rather than blocking
  # every PR. Flip `continue-on-error` to `false` once the audit is clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action refuses to run when it and
      # package.json's "packageManager" both name a version, and package.json
      # is the one place that decides it (pnpm@9.0.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # Opens the built site in a real browser and checks what unit tests cannot: page layout, the 3D
  # Globe's full view and events list, keyboard focus, and what the help chat sends (tools/e2e,
  # see its README). Everything outside the site is answered from canned data, so it needs no
  # secrets or network.
  #
  # `continue-on-error: true`, deliberately, for now: software-rendered WebGL on a shared runner
  # has not yet run enough times to know it never flakes. The job stays visible in every CI run;
  # flip `continue-on-error` to `false` once it has been green for a couple of weeks.
  browser-checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose (see the first job).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm --filter @world-vitality/web run build
      - name: Install the browser checks and Chromium
        working-directory: tools/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser checks
        working-directory: tools/e2e
        run: node run.cjs
      - name: Keep the screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-output
          path: tools/e2e/.out
          retention-days: 7
          if-no-files-found: ignore
